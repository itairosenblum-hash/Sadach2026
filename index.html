<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--teal-dark:#0f4c4c;--teal:#2f8f7a;--teal-soft:#dff0ea;--bg1:#eaf6f6;--bg2:#dff0ea;--accent:#d97b3f;--text-mid:#4f6f6a;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{font-family:'Rubik',sans-serif;color:var(--teal-dark);background:linear-gradient(180deg,var(--bg1),var(--bg2));min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:calc(36px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
.wrap{width:100%;max-width:480px;flex:1;display:flex;flex-direction:column;align-items:center}
.logo{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 30px rgba(15,76,76,.18);background:#fff}
.org{margin-top:14px;font-size:.85rem;font-weight:700;color:var(--accent);letter-spacing:.02em}
.idle{margin-top:26px;width:100%;background:#fff;border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 10px 30px rgba(15,76,76,.08);border:1px solid rgba(15,76,76,.07)}
.idle .ic{font-size:2.4rem;display:block;margin-bottom:10px}
.idle h1{font-size:1.45rem;font-weight:900}
.idle p{margin-top:8px;color:var(--text-mid);font-size:.95rem;line-height:1.6}
.sec{margin:30px 0 10px;font-size:.9rem;font-weight:700;color:var(--text-mid);align-self:flex-start}
a.ev{display:flex;align-items:center;gap:14px;width:100%;background:rgba(255,255,255,.75);border-radius:18px;padding:16px 18px;
  text-decoration:none;color:inherit;border:1px solid rgba(15,76,76,.09);transition:transform .15s}
a.ev:active{transform:scale(.98)}
a.ev .ei{width:46px;height:46px;border-radius:14px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0}
a.ev b{display:block;font-size:1rem}
a.ev small{color:var(--text-mid);font-size:.82rem}
a.ev .go{margin-inline-start:auto;color:var(--accent);font-weight:900;font-size:1.1rem}
a.all{margin-top:12px;color:var(--teal);font-weight:700;font-size:.88rem;text-decoration:none}
.foot{margin-top:auto;padding-top:34px}
.foot a{color:var(--text-mid);font-size:.8rem;text-decoration:none;opacity:.8}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="icon-192.png" alt="">
  <div class="org">המערך הלוגיסטי</div>

  <div class="idle">
    <span class="ic">🧭</span>
    <h1>אין כרגע אירוע פעיל</h1>
    <p>האירוע הבא יפורסם כאן, כולל פרטים, לו"ז והרשמה.</p>
  </div>

  <div class="sec">🗂️ אירועים קודמים</div>
  <a class="ev" href="archive/chinuch-tiberias-2026/">
    <span class="ei">🏞️</span>
    <span><b>סדרת חינוך · טבריה</b><small>4–5 בנובמבר 2026 · תמונות, לו"ז ומשתתפים</small></span>
    <span class="go">←</span>
  </a>
  <a class="all" href="archive/">לכל האירועים הקודמים</a>

  <div class="foot"><a href="admin.html">🔐 ניהול</a></div>
</div>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(function(){});
  });
}
</script>
</body>
</html>
