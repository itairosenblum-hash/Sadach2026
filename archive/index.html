<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ארכיון אירועים</title>
<link rel="icon" href="../favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal-dark:#0f4c4c;--teal:#1f7a7a;--accent:#d97b3f;--text-mid:#4a6b6b;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Heebo',sans-serif;background:linear-gradient(180deg,#eaf6f6,#f7fbfb);color:var(--teal-dark);min-height:100vh;padding:32px 16px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:1.5rem;font-weight:800;text-align:center;margin-bottom:6px}
.sub{text-align:center;color:var(--text-mid);font-size:.9rem;margin-bottom:22px}
a.ev{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 6px 20px rgba(15,76,76,.08);border:1px solid rgba(15,76,76,.08)}
a.ev .ic{font-size:1.8rem}
a.ev b{display:block;font-size:1.05rem}
a.ev small{color:var(--text-mid)}
a.ev .go{margin-inline-start:auto;color:var(--accent);font-weight:700}
.back{display:block;text-align:center;margin-top:20px;color:var(--teal);font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>🗂️ ארכיון אירועים</h1>
  <p class="sub">אירועים שהסתיימו · לצפייה בלבד</p>
  <div id="list"><p class="sub">טוען...</p></div>
  <a class="back" href="../">← לאתר הנוכחי</a>
</div>
<script>
(function(){
  var STATIC = { 'chinuch-tiberias-2026': 'chinuch-tiberias-2026/' };
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function sv(f, k){ return f[k] && (f[k].stringValue || '') || ''; }
  fetch('https://firestore.googleapis.com/v1/projects/sadach-a63c7/databases/(default)/documents/archives?key=AIzaSyB7mXq6CuqSxS6A20xIir6EkrR3rMPSvCI', { cache: 'no-store' })
    .then(function(r){ return r.ok ? r.json() : { documents: [] }; })
    .then(function(j){
      var list = (j.documents || []).filter(function(d){ return sv(d.fields || {}, 'status') === 'done'; })
        .sort(function(a, b){ return String(b.createTime).localeCompare(String(a.createTime)); });
      document.getElementById('list').innerHTML = list.length ? list.map(function(d){
        var id = d.name.split('/').pop(), f = d.fields || {};
        var href = STATIC[id] || ('../?archive=' + encodeURIComponent(id));
        return '<a class="ev" href="' + href + '"><span class="ic">🏞️</span><span><b>' + esc(sv(f, 'title') || id) + '</b><small>' + esc(sv(f, 'date')) + '</small></span><span class="go">←</span></a>';
      }).join('') : '<p class="sub">אין עדיין אירועים בארכיון</p>';
    })
    .catch(function(){ document.getElementById('list').innerHTML = '<p class="sub">לא ניתן לטעון כרגע</p>'; });
})();
</script>
</body>
</html>
